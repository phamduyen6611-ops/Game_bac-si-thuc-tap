<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eaf4ff">
<title>Bác sĩ thực tập 24h — 3D Mobile V2.1</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--panel:rgba(255,255,255,.93);--text:#18202a;--muted:#657080;--border:#d8dee7;--accent:#2563eb}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:10px;min-height:100vh}button{font:inherit;color:inherit}.app{max-width:900px;margin:auto;display:grid;gap:10px}
.top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.title{font-weight:800;font-size:18px}.sub{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:7px}.pill{padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:#fff}
.shell{border:1px solid var(--border);border-radius:18px;overflow:hidden;background:#fff}
#stage{height:min(74vh,660px);min-height:520px;position:relative;touch-action:none;user-select:none;background:#dcefff}
#game{display:block;width:100%;height:100%}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:20;text-align:center}
.hud,.floor,.hint{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:12px;z-index:5}
.hud{left:9px;top:9px;max-width:67%;padding:9px 11px;font-size:12px}.hud b{display:block}.floor{right:9px;top:9px;padding:8px 10px;font-size:12px}
.hint{left:50%;bottom:145px;transform:translateX(-50%);padding:9px 11px;font-size:13px;text-align:center;max-width:76%}.hidden{display:none!important}
.joy{position:absolute;left:14px;bottom:14px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.66);border:1px solid var(--border);z-index:6}
.joy:after{content:"";position:absolute;inset:17px;border:1px solid var(--border);border-radius:50%}.stick{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);z-index:1}
.actions{position:absolute;right:14px;bottom:14px;display:grid;gap:8px;justify-items:end;z-index:6}.btn{min-height:46px;border:1px solid var(--border);background:rgba(255,255,255,.93);border-radius:999px;padding:0 16px;font-weight:700}.btn.primary{min-height:58px;background:var(--accent);color:#fff;border-color:var(--accent)}
.below{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.log{background:#fff;border:1px solid var(--border);border-radius:13px;padding:11px;font-size:14px;line-height:1.5}.reset{border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700}.help{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:540px){body{padding:7px}.title{font-size:16px}#stage{height:74vh;min-height:520px}.below{grid-template-columns:1fr}.reset{width:100%}}
</style>
</head>
<body>
<main class="app">
  <section class="top">
    <div><div class="title">Bác sĩ thực tập 24h — V2.1</div><div id="mission" class="sub">Đang vào bệnh viện…</div></div>
    <div class="stats"><div class="pill">⭐ <b id="score">100</b></div><div class="pill">❤️ <b id="life">3</b></div></div>
  </section>
  <section class="shell">
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="loading" class="loading"><div><div style="font-size:34px">🏥</div><div id="loadText">Đang tải đồ họa 3D…</div></div></div>
      <div class="hud"><b>📋 Nhiệm vụ</b><div id="task">Gặp bác sĩ hướng dẫn</div></div>
      <div class="floor">🏢 Tầng <span id="floor">1</span></div>
      <div id="hint" class="hint hidden"></div>
      <div id="joy" class="joy"><div id="stick" class="stick"></div></div>
      <div class="actions"><button id="run" class="btn" type="button">🏃 Chạy</button><button id="use" class="btn primary" type="button">TƯƠNG TÁC</button></div>
    </div>
  </section>
  <section class="below">
    <div><div id="log" class="log" aria-live="polite">Vuốt màn hình 3D để xoay camera.</div><div class="help">Joystick trái để di chuyển • vuốt màn hình để xoay • TƯƠNG TÁC để nói chuyện, ngồi ghế, vào khoa hoặc dùng thang máy.</div></div>
    <button id="reset" class="reset" type="button">🔄 Chơi lại</button>
  </section>
</main>
<script type="module">
const $=s=>document.querySelector(s);
const canvas=$('#game'),stage=$('#stage'),loading=$('#loading'),loadText=$('#loadText');
const mission=$('#mission'),task=$('#task'),scoreEl=$('#score'),lifeEl=$('#life'),floorEl=$('#floor'),log=$('#log');
const joy=$('#joy'),stick=$('#stick'),use=$('#use'),run=$('#run'),reset=$('#reset'),hint=$('#hint');
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.179.1/+esm');loadText.textContent='Đang dựng phòng và nhân vật…';}catch(err){loadText.textContent='Không tải được đồ họa 3D. Kiểm tra Internet rồi tải lại trang.';console.error(err);}
if(THREE){try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdcefff);scene.fog=new THREE.Fog(0xdcefff,35,80);
const camera=new THREE.PerspectiveCamera(58,1,.1,120);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.shadowMap.enabled=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x728091,1.7));
const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(15,25,10);sun.castShadow=true;scene.add(sun);
const floorMesh=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0xe8edf2,roughness:.95}));floorMesh.rotation.x=-Math.PI/2;floorMesh.receiveShadow=true;scene.add(floorMesh);
const grid=new THREE.GridHelper(60,30,0xb7c3ce,0xd3dce4);grid.position.y=.01;scene.add(grid);
function box(w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.82}));m.castShadow=true;m.receiveShadow=true;return m;}
function label(text){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle='rgba(20,28,38,.9)';x.fillRect(5,10,502,108);x.fillStyle='#fff';x.font='bold 38px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,64);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(4,1,1);return s;}
const floors={1:[],2:[]};
const depts=[{name:'Khoa Nội',floor:1,x:-18,z:-17,color:0x80a9d1},{name:'Khoa Ngoại',floor:1,x:18,z:-17,color:0xd49c7e},{name:'Cấp cứu',floor:1,x:18,z:17,color:0xd67884},{name:'Khoa Nhi',floor:2,x:-18,z:17,color:0xe2bf62},{name:'Xét nghiệm',floor:2,x:0,z:-18,color:0xa38bc3},{name:'Chẩn đoán hình ảnh',floor:2,x:0,z:18,color:0x7eae9d}];
depts.forEach(d=>{const g=new THREE.Group();const b=box(9,4.5,7,d.color);b.position.y=2.25;g.add(b);const roof=box(9.4,.22,7.4,0xffffff);roof.position.y=4.62;g.add(roof);const door=box(1.4,2.1,.12,0x48657e);door.position.set(0,1.05,3.56);g.add(door);const s=label(d.name);s.position.set(0,5.7,0);g.add(s);g.position.set(d.x,0,d.z);scene.add(g);floors[d.floor].push(g);});
function person(o){const g=new THREE.Group();for(const x of [-.2,.2]){const l=box(.28,.8,.28,0x2d3a48);l.position.set(x,.4,0);g.add(l);}const body=box(1,1.25,.62,o.color);body.position.y=1.42;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,20,16),new THREE.MeshStandardMaterial({color:0xf1c5a4}));head.position.y=2.38;head.castShadow=true;g.add(head);const eyeMat=new THREE.MeshBasicMaterial({color:0x202020});for(const x of [-.16,.16]){const e=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),eyeMat);e.position.set(x,2.45,.455);g.add(e);}const mouth=box(.24,.035,.025,0x9e4a4a);mouth.position.set(0,2.22,.47);g.add(mouth);if(o.doctor){const coat=box(1.05,1.28,.68,0xffffff);coat.position.set(0,1.42,.02);g.add(coat);}const s=label(o.label);s.scale.set(3.1,.78,1);s.position.set(0,3.35,0);g.add(s);g.position.set(o.x,0,o.z);g.userData.floor=o.floor||1;scene.add(g);floors[g.userData.floor].push(g);return g;}
const player=person({x:0,z:26,color:0xd9e7f5,doctor:true,label:'Bạn',floor:1});
const guide=person({x:0,z:20,color:0xe1e9f1,doctor:true,label:'BS hướng dẫn',floor:1});
const nurse=person({x:-7,z:6,color:0xd8a2c6,label:'Y tá Mai',floor:1});
const patients=[{name:'bác An',mesh:person({x:-11,z:-3,color:0x89a8c3,label:'Bác An',floor:1})},{name:'cô Bình',mesh:person({x:11,z:4,color:0xdda3ba,label:'Cô Bình',floor:1})},{name:'chú Minh',mesh:person({x:-10,z:8,color:0x86a67c,label:'Chú Minh',floor:2})},{name:'cô Lan',mesh:person({x:10,z:-7,color:0xd4aa86,label:'Cô Lan',floor:2})}];
function bench(x,z,f){const g=new THREE.Group();const s=box(3,.25,1,0x8a6040);s.position.y=.85;g.add(s);const b=box(3,.9,.18,0x745039);b.position.set(0,1.3,-.4);g.add(b);g.position.set(x,0,z);g.userData.floor=f;scene.add(g);floors[f].push(g);return g;}
const benches=[bench(-4,2,1),bench(0,2,1),bench(4,2,1),bench(-4,-2,2),bench(0,-2,2),bench(4,-2,2)];
const elevator=box(5,2.8,4,0x8998a7);elevator.position.set(0,1.4,-2);scene.add(elevator);const elevLabel=label('THANG MÁY');elevLabel.position.set(0,4,-2);scene.add(elevLabel);
function setFloor(f){player.userData.floor=f;floorEl.textContent=f;for(const n of [1,2])floors[n].forEach(o=>{if(o!==player)o.visible=n===f;});player.visible=true;elevator.visible=true;elevLabel.visible=true;}
function dist(a,b){return Math.hypot(a.position.x-b.position.x,a.position.z-b.position.z)}
function nearDept(){return depts.find(d=>d.floor===player.userData.floor&&Math.hypot(player.position.x-d.x,player.position.z-d.z)<5.4)}
function nearBench(){return benches.find(b=>b.userData.floor===player.userData.floor&&dist(player,b)<3)}
let state;
function restart(){state={step:0,score:100,life:3,run:false,over:false,target:null,dept:null};player.position.set(0,0,26);player.rotation.y=Math.PI;setFloor(1);scoreEl.textContent=100;lifeEl.textContent=3;mission.textContent='Gặp bác sĩ hướng dẫn ở sảnh.';task.textContent='0/5 Nhận nhiệm vụ';log.textContent='Đi tới bác sĩ hướng dẫn và nhấn TƯƠNG TÁC.';}
function punish(t){state.score=Math.max(0,state.score-15);state.life=Math.max(0,state.life-1);scoreEl.textContent=state.score;lifeEl.textContent=state.life;log.textContent='😠 '+t;if(state.life<=0){state.over=true;task.textContent='❌ Thất bại';mission.textContent='Nhấn Chơi lại để thử lại.';}}
function interactNow(){if(state.over)return;if(dist(player,elevator)<3.5){const f=player.userData.floor===1?2:1;setFloor(f);player.position.set(0,0,2);log.textContent='🛗 Đã tới tầng '+f+'.';return;}if(state.step===0){if(player.userData.floor===1&&dist(player,guide)<3){state.target=patients[Math.floor(Math.random()*patients.length)];state.dept=depts[Math.floor(Math.random()*depts.length)];state.step=1;task.textContent='1/5 Tìm bệnh nhân';mission.textContent='Tìm '+state.target.name+' ở tầng '+state.target.mesh.userData.floor+'.';log.textContent='👨‍⚕️ “Tìm đúng bệnh nhân nhé, đừng nhận nhầm người.”';}else log.textContent='Bạn chưa đứng gần bác sĩ hướng dẫn.';return;}if(state.step===1){const p=patients.find(p=>p.mesh.userData.floor===player.userData.floor&&dist(player,p.mesh)<2.8);if(!p){log.textContent='Chưa đứng gần bệnh nhân.';return;}if(p!==state.target){punish('Sai bệnh nhân! Em phải tìm '+state.target.name+'.');return;}state.step=2;state.score+=20;scoreEl.textContent=state.score;task.textContent='2/5 Tìm ghế';mission.textContent='Tìm một ghế chờ ở tầng này.';log.textContent='🙂 '+p.name+': “Chào bác sĩ thực tập.”';return;}if(state.step===2){if(!nearBench()){log.textContent='Bạn chưa đứng gần ghế.';return;}state.step=3;state.score+=15;scoreEl.textContent=state.score;task.textContent='3/5 Tìm đúng khoa';mission.textContent='Mang hồ sơ tới '+state.dept.name+' — tầng '+state.dept.floor+'.';log.textContent='🪑 Đã tìm được chỗ ngồi.';return;}if(state.step===3){const d=nearDept();if(!d){log.textContent='Đứng gần cửa khoa rồi tương tác.';return;}if(d!==state.dept){punish('Nhầm khoa! Đây là '+d.name+'.');return;}state.step=4;state.score+=50;scoreEl.textContent=state.score;task.textContent='4/5 Gặp Y tá Mai';mission.textContent='Quay về tầng 1 gặp Y tá Mai.';log.textContent='✅ Hồ sơ đã được giao đúng khoa.';return;}if(state.step===4){if(player.userData.floor===1&&dist(player,nurse)<3){state.step=5;state.score+=20;scoreEl.textContent=state.score;task.textContent='5/5 Báo cáo bác sĩ';mission.textContent='Quay lại bác sĩ hướng dẫn.';log.textContent='👩‍⚕️ Y tá Mai: “Ổn rồi, về báo cáo bác sĩ nhé.”';}else log.textContent='Hãy tìm Y tá Mai ở tầng 1.';return;}if(state.step===5){if(player.userData.floor===1&&dist(player,guide)<3){state.over=true;state.score+=30;scoreEl.textContent=state.score;task.textContent='🎉 Hoàn thành';mission.textContent='Ca trực hoàn thành — '+state.score+' điểm!';log.textContent='😎 Bác sĩ hướng dẫn: “Tốt lắm!”';}else log.textContent='Quay lại gặp bác sĩ hướng dẫn.';}}
use.addEventListener('click',interactNow);run.addEventListener('click',()=>{state.run=!state.run;run.textContent=state.run?'🏃 Đang chạy':'🏃 Chạy'});reset.addEventListener('click',restart);
let jx=0,jy=0,jid=null;
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const mx=r.width*.3,l=Math.hypot(dx,dy)||1;if(l>mx){dx=dx/l*mx;dy=dy/l*mx}jx=dx/mx;jy=dy/mx;stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e)});const joyEnd=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;stick.style.transform='translate(-50%,-50%)'};joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
let yaw=0,pitch=.4,drag=null,lx=0,ly=0;
stage.addEventListener('pointerdown',e=>{if(joy.contains(e.target)||e.target.closest('button'))return;drag=e.pointerId;lx=e.clientX;ly=e.clientY;stage.setPointerCapture?.(e.pointerId)});stage.addEventListener('pointermove',e=>{if(e.pointerId!==drag)return;yaw-=(e.clientX-lx)*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-ly)*.004,.18,.75);lx=e.clientX;ly=e.clientY});stage.addEventListener('pointerup',e=>{if(e.pointerId===drag)drag=null});stage.addEventListener('pointercancel',()=>drag=null);
function showHint(){let t='';if(player.userData.floor===1&&dist(player,guide)<3.4)t='👨‍⚕️ Bác sĩ hướng dẫn';else if(dist(player,elevator)<3.7)t='🛗 Thang máy';else if(player.userData.floor===1&&dist(player,nurse)<3.2)t='👩‍⚕️ Y tá Mai';else{const p=patients.find(p=>p.mesh.userData.floor===player.userData.floor&&dist(player,p.mesh)<3);if(p)t='👤 '+p.name;if(nearBench())t='🪑 Ghế chờ';const d=nearDept();if(d)t='🏥 '+d.name;}if(t){hint.textContent=t+' — nhấn TƯƠNG TÁC';hint.classList.remove('hidden')}else hint.classList.add('hidden');}
function resize(){const w=canvas.clientWidth||700,h=canvas.clientHeight||620;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);resize();
let last=performance.now(),bob=0;
function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;if(!state.over){let x=jx,z=jy;if(Math.hypot(x,z)>.08){const l=Math.hypot(x,z)||1;x/=l;z/=l;const c=Math.cos(yaw),s=Math.sin(yaw),wx=x*c-z*s,wz=x*s+z*c,sp=state.run?10:6.3;player.position.x=THREE.MathUtils.clamp(player.position.x+wx*sp*dt,-28,28);player.position.z=THREE.MathUtils.clamp(player.position.z+wz*sp*dt,-28,28);player.rotation.y=Math.atan2(wx,wz);bob+=dt*(state.run?12:8);player.position.y=Math.abs(Math.sin(bob))*.06;}else player.position.y*=.85;}const radius=8.5,height=4.5+pitch*5;camera.position.lerp(new THREE.Vector3(player.position.x+Math.sin(yaw)*radius,height,player.position.z+Math.cos(yaw)*radius),.1);camera.lookAt(player.position.x,1.8,player.position.z);showHint();renderer.render(scene,camera);requestAnimationFrame(loop);}
restart();loading.remove();requestAnimationFrame(loop);
}catch(err){console.error(err);loadText.textContent='Có lỗi khi dựng bệnh viện 3D. Hãy tải lại trang.'}}
</script>
</body>
</html>
