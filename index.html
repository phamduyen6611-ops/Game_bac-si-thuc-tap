<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Bác sĩ thực tập 24h — Chibi</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#eef6ff;color:#18202a}#app{max-width:900px;margin:auto;padding:8px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.stats{display:flex;gap:8px}.pill,.panel{background:#fff;border:1px solid #d8e0ea;border-radius:12px;padding:8px 10px}.stage{height:74vh;min-height:520px;max-height:680px;position:relative;overflow:hidden;border-radius:18px;border:1px solid #cfd9e6;background:#dff1ff;touch-action:none}.stage canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:10px;top:10px;max-width:67%;background:#ffffffee;border:1px solid #d8e0ea;border-radius:12px;padding:8px;font-size:12px}.floor{position:absolute;right:10px;top:10px;background:#ffffffee;border:1px solid #d8e0ea;border-radius:12px;padding:8px;font-size:12px}.joy{position:absolute;left:14px;bottom:14px;width:118px;height:118px;border-radius:50%;background:#ffffffaa;border:1px solid #cfd9e6}.stick{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:#2563eb;transform:translate(-50%,-50%)}.actions{position:absolute;right:14px;bottom:14px;display:grid;gap:8px;justify-items:end}.btn{border:1px solid #cfd9e6;border-radius:999px;background:#fff;padding:12px 16px;font-weight:700}.btn.main{background:#2563eb;color:#fff;min-height:58px}.hint{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);background:#ffffffef;border:1px solid #cfd9e6;border-radius:12px;padding:8px 10px;font-size:13px;max-width:75%;text-align:center}.hidden{display:none}.log{margin-top:8px;background:#fff;border:1px solid #d8e0ea;border-radius:12px;padding:10px;font-size:14px}.small{font-size:12px;color:#667085}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:20}.reset{margin-top:8px;width:100%;border:1px solid #cfd9e6;border-radius:12px;background:#fff;padding:10px;font-weight:700}</style></head><body><div id="app"><div class="top"><div><b>Bác sĩ thực tập 24h — Chibi V2.2</b><div id="mission" class="small">Đang vào bệnh viện…</div></div><div class="stats"><div class="pill">⭐ <span id="score">100</span></div><div class="pill">❤️ <span id="life">3</span></div></div></div><div id="stage" class="stage"><canvas id="game"></canvas><div id="loading" class="loading">🏥 Đang dựng bệnh viện chibi…</div><div class="hud"><b>📋 Nhiệm vụ</b><div id="task">Gặp bác sĩ hướng dẫn</div></div><div class="floor">🏢 Tầng <span id="floor">1</span></div><div id="hint" class="hint hidden"></div><div id="joy" class="joy"><div id="stick" class="stick"></div></div><div class="actions"><button id="run" class="btn">🏃 Chạy</button><button id="use" class="btn main">TƯƠNG TÁC</button></div></div><div id="log" class="log">Joystick trái để di chuyển, vuốt màn hình để xoay camera.</div><button id="reset" class="reset">🔄 Chơi lại</button></div><script type="module">const $=s=>document.querySelector(s),canvas=$('#game'),stage=$('#stage'),loading=$('#loading'),mission=$('#mission'),task=$('#task'),scoreEl=$('#score'),lifeEl=$('#life'),floorEl=$('#floor'),log=$('#log'),joy=$('#joy'),stick=$('#stick'),use=$('#use'),run=$('#run'),reset=$('#reset'),hint=$('#hint');let THREE;try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.179.1/+esm')}catch(e){loading.textContent='Không tải được 3D. Hãy kiểm tra Internet.'}if(THREE){const scene=new THREE.Scene();scene.background=new THREE.Color(0xdff1ff);scene.fog=new THREE.Fog(0xdff1ff,38,82);const camera=new THREE.PerspectiveCamera(58,1,.1,120);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.shadowMap.enabled=true;scene.add(new THREE.HemisphereLight(0xffffff,0x718096,1.8));const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(14,25,12);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(62,62),new THREE.MeshStandardMaterial({color:0xe9eef5,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);scene.add(new THREE.GridHelper(62,31,0xbac6d2,0xd8e0e8));function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.82}));m.castShadow=true;m.receiveShadow=true;return m}function ball(r,c){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),new THREE.MeshStandardMaterial({color:c,roughness:.85}));m.castShadow=true;return m}function label(t){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle='#18202ae8';x.fillRect(4,12,504,104);x.fillStyle='#fff';x.font='bold 36px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,256,64);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(3.7,.92,1);return s}const floors={1:[],2:[]};const depts=[['Khoa Nội',1,-19,-17,0x82abd3],['Khoa Ngoại',1,19,-17,0xd6a07f],['Cấp cứu',1,19,17,0xdb7d88],['Khoa Nhi',2,-19,17,0xe4c568],['Xét nghiệm',2,0,-19,0xa48cc5],['Chẩn đoán hình ảnh',2,0,19,0x7fb29f]].map(a=>({name:a[0],floor:a[1],x:a[2],z:a[3],color:a[4]}));depts.forEach(d=>{const g=new THREE.Group(),b=box(10,5,8,d.color);b.position.y=2.5;g.add(b);const roof=box(10.4,.25,8.4,0xffffff);roof.position.y=5.1;g.add(roof);const door=box(1.5,2.4,.15,0x49687f);door.position.set(0,1.2,4.05);g.add(door);const s=label(d.name);s.position.set(0,6.2,0);g.add(s);g.position.set(d.x,0,d.z);scene.add(g);floors[d.floor].push(g)});function chibi(o){const g=new THREE.Group(),skin=o.skin||0xf2c5a4,hair=o.hair||0x3c2b25;for(const x of[-.23,.23]){const leg=box(.25,.58,.25,0x34404d);leg.position.set(x,.3,0);g.add(leg);const shoe=box(.42,.16,.62,o.shoe||0x26313c);shoe.position.set(x,.09,.11);shoe.scale.x=1.12;g.add(shoe)}const body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.72,6,10),new THREE.MeshStandardMaterial({color:o.color,roughness:.85}));body.position.y=1.08;body.castShadow=true;g.add(body);for(const side of[-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.46,5,8),new THREE.MeshStandardMaterial({color:o.color}));arm.position.set(side*.57,1.12,.02);arm.rotation.z=side*.42;g.add(arm)}if(o.doctor){const coat=box(1.08,1.02,.66,0xffffff);coat.position.set(0,1.1,.01);g.add(coat);const badge=box(.14,.22,.04,0x4a84ff);badge.position.set(.27,1.18,.36);g.add(badge)}const head=ball(.7,skin);head.position.y=2.12;head.scale.set(1.03,1.08,1);g.add(head);const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.72,20,16,0,Math.PI*2,0,Math.PI*.62),new THREE.MeshStandardMaterial({color:hair}));hairCap.position.y=2.4;hairCap.scale.y=.78;g.add(hairCap);for(const ex of[-.23,.23]){const white=ball(.13,0xffffff);white.position.set(ex,2.2,.59);white.scale.z=.38;g.add(white);const eye=ball(.06,0x202020);eye.position.set(ex,2.19,.66);g.add(eye);const shine=ball(.018,0xffffff);shine.position.set(ex+.018,2.215,.705);g.add(shine)}for(const cx of[-.37,.37]){const cheek=ball(.1,0xff9fb5);cheek.position.set(cx,2.0,.6);cheek.scale.z=.28;g.add(cheek)}const mouth=new THREE.Mesh(new THREE.TorusGeometry(.13,.03,8,18,Math.PI),new THREE.MeshBasicMaterial({color:0x9c4950}));mouth.position.set(0,1.9,.65);mouth.rotation.z=Math.PI;g.add(mouth);if(o.glasses){for(const ex of[-.23,.23]){const ring=new THREE.Mesh(new THREE.TorusGeometry(.15,.018,8,18),new THREE.MeshBasicMaterial({color:0x303844}));ring.position.set(ex,2.2,.68);g.add(ring)}const br=box(.12,.02,.02,0x303844);br.position.set(0,2.2,.68);g.add(br)}if(o.moustache){for(const x of[-.09,.09]){const m=ball(.09,0x4b352c);m.position.set(x,1.99,.66);m.scale.set(1.5,.45,.45);m.rotation.z=x<0?.35:-.35;g.add(m)}}if(o.nurse){const cap=box(.68,.13,.46,0xffffff);cap.position.set(0,2.82,.02);g.add(cap);const cross=box(.12,.14,.05,0xe5545d);cross.position.set(0,2.82,.27);g.add(cross)}if(o.old){const brow1=box(.2,.035,.03,0x8a8d92);brow1.position.set(-.22,2.38,.66);brow1.rotation.z=-.12;g.add(brow1);const brow2=brow1.clone();brow2.position.x=.22;brow2.rotation.z=.12;g.add(brow2)}const s=label(o.label);s.position.set(0,3.55,0);g.add(s);g.position.set(o.x,0,o.z);g.userData.floor=o.floor||1;g.userData.phase=Math.random()*6.28;scene.add(g);floors[g.userData.floor].push(g);return g}const player=chibi({x:0,z:27,color:0x72c7bf,doctor:true,label:'Bạn',hair:0x332620,shoe:0x2f65b8,floor:1}),guide=chibi({x:0,z:20,color:0x73808f,doctor:true,glasses:true,moustache:true,label:'BS hướng dẫn',hair:0x55545a,floor:1}),nurse=chibi({x:-7,z:6,color:0xf0a9c7,nurse:true,label:'Y tá Mai',hair:0x5d382e,shoe:0xe779a6,floor:1});const patients=[{name:'bác An',mesh:chibi({x:-11,z:-3,color:0x84a6c8,old:true,glasses:true,moustache:true,label:'Bác An',hair:0x72767c,floor:1})},{name:'cô Bình',mesh:chibi({x:11,z:4,color:0xe4a7bf,label:'Cô Bình',hair:0x623b30,shoe:0xc96c94,floor:1})},{name:'chú Minh',mesh:chibi({x:-10,z:8,color:0x8daf82,old:true,moustache:true,label:'Chú Minh',hair:0x72767c,floor:2})},{name:'cô Lan',mesh:chibi({x:10,z:-7,color:0xe2a68a,label:'Cô Lan',hair:0x513229,glasses:true,floor:2})}];function bench(x,z,f){const g=new THREE.Group(),s=box(3,.25,1,0x8b6140);s.position.y=.85;g.add(s);const b=box(3,.9,.18,0x74503a);b.position.set(0,1.3,-.4);g.add(b);g.position.set(x,0,z);g.userData.floor=f;scene.add(g);floors[f].push(g);return g}const benches=[bench(-4,2,1),bench(0,2,1),bench(4,2,1),bench(-4,-2,2),bench(0,-2,2),bench(4,-2,2)],elevator=box(5,2.8,4,0x8998a7);elevator.position.set(0,1.4,-2);scene.add(elevator);const elab=label('THANG MÁY');elab.position.set(0,4,-2);scene.add(elab);function dist(a,b){return Math.hypot(a.position.x-b.position.x,a.position.z-b.position.z)}function setFloor(f){player.userData.floor=f;floorEl.textContent=f;for(const k of[1,2])floors[k].forEach(o=>{if(o!==player)o.visible=k===f});player.visible=true;elevator.visible=true;elab.visible=true}function nearDept(){return depts.find(d=>d.floor===player.userData.floor&&Math.hypot(player.position.x-d.x,player.position.z-d.z)<5.5)}function nearBench(){return benches.find(b=>b.userData.floor===player.userData.floor&&dist(player,b)<3)}let state;function restart(){state={step:0,score:100,life:3,run:false,over:false,target:null,dept:null};player.position.set(0,0,27);setFloor(1);scoreEl.textContent=100;lifeEl.textContent=3;task.textContent='0/5 Nhận nhiệm vụ';mission.textContent='Gặp bác sĩ hướng dẫn ở sảnh.';log.textContent='Đi tới bác sĩ hướng dẫn rồi nhấn TƯƠNG TÁC.'}function punish(t){state.score=Math.max(0,state.score-15);state.life=Math.max(0,state.life-1);scoreEl.textContent=state.score;lifeEl.textContent=state.life;log.textContent='😠 '+t;if(!state.life){state.over=true;task.textContent='❌ Thất bại'}}function interact(){if(state.over)return;if(dist(player,elevator)<3.5){const f=player.userData.floor===1?2:1;setFloor(f);player.position.set(0,0,2);log.textContent='🛗 Đã tới tầng '+f;return}if(state.step===0){if(player.userData.floor===1&&dist(player,guide)<3){state.target=patients[Math.floor(Math.random()*patients.length)];state.dept=depts[Math.floor(Math.random()*depts.length)];state.step=1;task.textContent='1/5 Tìm bệnh nhân';mission.textContent='Tìm '+state.target.name+' ở tầng '+state.target.mesh.userData.floor;log.textContent='👨‍⚕️ Bác sĩ hướng dẫn: “Nhìn kỹ nhé, đừng nhận nhầm!”'}else log.textContent='Bạn chưa đứng gần bác sĩ hướng dẫn.';return}if(state.step===1){const p=patients.find(p=>p.mesh.userData.floor===player.userData.floor&&dist(player,p.mesh)<2.9);if(!p){log.textContent='Chưa đứng gần bệnh nhân.';return}if(p!==state.target){punish('Nhầm bệnh nhân rồi!');return}state.step=2;state.score+=20;scoreEl.textContent=state.score;task.textContent='2/5 Tìm ghế';mission.textContent='Tìm một ghế chờ ở tầng này.';log.textContent='🙂 '+p.name+': “Chào bác sĩ thực tập!”';return}if(state.step===2){if(!nearBench()){log.textContent='Bạn chưa đứng gần ghế.';return}state.step=3;state.score+=15;scoreEl.textContent=state.score;task.textContent='3/5 Tìm đúng khoa';mission.textContent='Mang hồ sơ tới '+state.dept.name+' — tầng '+state.dept.floor;return}if(state.step===3){const d=nearDept();if(!d){log.textContent='Đứng gần cửa khoa rồi tương tác.';return}if(d!==state.dept){punish('Nhầm khoa! Đây là '+d.name);return}state.step=4;state.score+=50;scoreEl.textContent=state.score;task.textContent='4/5 Gặp Y tá Mai';mission.textContent='Quay về tầng 1 gặp Y tá Mai.';return}if(state.step===4){if(player.userData.floor===1&&dist(player,nurse)<3){state.step=5;state.score+=20;scoreEl.textContent=state.score;task.textContent='5/5 Báo cáo bác sĩ';mission.textContent='Quay lại bác sĩ hướng dẫn.';log.textContent='👩‍⚕️ Y tá Mai: “Ổn áp! Về báo cáo nhé.”'}else log.textContent='Hãy tìm Y tá Mai ở tầng 1.';return}if(state.step===5){if(player.userData.floor===1&&dist(player,guide)<3){state.over=true;state.score+=30;scoreEl.textContent=state.score;task.textContent='🎉 Hoàn thành';mission.textContent='Ca trực hoàn thành — '+state.score+' điểm!';log.textContent='😎 Bác sĩ hướng dẫn: “Khá lắm, nhưng cái đầu chibi hơi to đấy!”'}else log.textContent='Quay lại gặp bác sĩ hướng dẫn.'}}use.onclick=interact;run.onclick=()=>{state.run=!state.run;run.textContent=state.run?'🏃 Đang chạy':'🏃 Chạy'};reset.onclick=restart;let jx=0,jy=0,jid=null;function jm(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,m=r.width*.3,l=Math.hypot(dx,dy)||1;if(l>m){dx=dx/l*m;dy=dy/l*m}jx=dx/m;jy=dy/m;stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};function je(e){if(e.pointerId!==jid)return;jid=null;jx=jy=0;stick.style.transform='translate(-50%,-50%)'}joy.onpointerup=je;joy.onpointercancel=je;let yaw=0,pitch=.4,drag=null,lx=0,ly=0;stage.onpointerdown=e=>{if(joy.contains(e.target)||e.target.closest('button'))return;drag=e.pointerId;lx=e.clientX;ly=e.clientY};stage.onpointermove=e=>{if(e.pointerId!==drag)return;yaw-=(e.clientX-lx)*.008;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-ly)*.004,.18,.75);lx=e.clientX;ly=e.clientY};stage.onpointerup=()=>drag=null;function resize(){const w=canvas.clientWidth||700,h=canvas.clientHeight||620;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);resize();function showHint(){let t='';if(player.userData.floor===1&&dist(player,guide)<3.4)t='👨‍⚕️ Bác sĩ hướng dẫn';else if(dist(player,elevator)<3.7)t='🛗 Thang máy';else if(player.userData.floor===1&&dist(player,nurse)<3.2)t='👩‍⚕️ Y tá Mai';else{const p=patients.find(p=>p.mesh.userData.floor===player.userData.floor&&dist(player,p.mesh)<3);if(p)t='👤 '+p.name;if(nearBench())t='🪑 Ghế chờ';const d=nearDept();if(d)t='🏥 '+d.name}if(t){hint.textContent=t+' — nhấn TƯƠNG TÁC';hint.classList.remove('hidden')}else hint.classList.add('hidden')}let last=performance.now(),bob=0;const chars=[player,guide,nurse,...patients.map(p=>p.mesh)];function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;if(!state.over){let x=jx,z=jy;if(Math.hypot(x,z)>.08){const l=Math.hypot(x,z)||1;x/=l;z/=l;const c=Math.cos(yaw),s=Math.sin(yaw),wx=x*c-z*s,wz=x*s+z*c,sp=state.run?10:6.2;player.position.x=THREE.MathUtils.clamp(player.position.x+wx*sp*dt,-28,28);player.position.z=THREE.MathUtils.clamp(player.position.z+wz*sp*dt,-28,28);player.rotation.y=Math.atan2(wx,wz);bob+=dt*(state.run?13:8);player.position.y=Math.abs(Math.sin(bob))*.08}else player.position.y*=.8}for(const ch of chars){if(ch.visible!==false){const target=Math.sin(t*.0025+ch.userData.phase)*.045;ch.rotation.z+=(target-ch.rotation.z)*.12}}const r=8.7,h=4.5+pitch*5;camera.position.lerp(new THREE.Vector3(player.position.x+Math.sin(yaw)*r,h,player.position.z+Math.cos(yaw)*r),.1);camera.lookAt(player.position.x,2,player.position.z);showHint();renderer.render(scene,camera);requestAnimationFrame(loop)}restart();loading.remove();requestAnimationFrame(loop)}</script></body></html>
